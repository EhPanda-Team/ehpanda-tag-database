name: Update Python

on:
  schedule:
    # Run off the hour to reduce scheduling congestion.
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-python
  cancel-in-progress: false

jobs:
  pick:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Find a newer Python that OpenCC has a wheel for
        id: pick
        run: python scripts/python_update.py pick

  land:
    needs: pick
    if: needs.pick.outputs.version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: main
      VERSION: ${{ needs.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements.txt'
      - name: Build every dataset on the current Python
        run: python scripts/update.py --output baseline
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.pick.outputs.version }}
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements.txt'
      - name: Run regression tests
        run: python -m unittest discover -s tests
      - name: Build every dataset on this Python
        run: python scripts/update.py --output dist
      - name: Push the update, or open a pull request if the data changed
        run: python scripts/python_update.py land "$VERSION" baseline dist
