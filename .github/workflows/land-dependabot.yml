name: Land Dependabot updates

on:
  schedule:
    # Off the hour to reduce scheduling congestion, and after Dependabot's weekly run.
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: land-dependabot
  cancel-in-progress: false

jobs:
  pick:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      actions: ${{ steps.pick.outputs.actions }}
      opencc: ${{ steps.pick.outputs.opencc }}
      opencc_head: ${{ steps.pick.outputs.opencc_head }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Find the updates to land
        id: pick
        run: python scripts/dependabot_update.py pick

  # The new package's code runs here, so this job cannot write to the repository.
  check:
    needs: pick
    if: needs.pick.outputs.opencc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      unchanged: ${{ steps.compare.outputs.unchanged }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements.txt'
      - name: Build every dataset on the current OpenCC
        run: python scripts/update.py --output baseline
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pick.outputs.opencc_head }}
          path: update
          persist-credentials: false
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r update/requirements.txt'
      - name: Run regression tests
        run: python -m unittest discover -s tests
      - name: Build every dataset on the new OpenCC
        run: python scripts/update.py --output dist
      - name: Compare the two builds
        id: compare
        run: python scripts/dependabot_update.py compare baseline dist

  # This job installs nothing, so only the repository's own scripts run with write access. It runs even when the
  # OpenCC check fails or is skipped, so that a problem there does not hold back a GitHub Actions update.
  land:
    needs: [pick, check]
    if: ${{ !cancelled() && (needs.pick.outputs.actions != '' || needs.check.outputs.unchanged == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: main
      ACTIONS_UPDATE: ${{ needs.pick.outputs.actions }}
      OPENCC_UPDATE: ${{ needs.check.outputs.unchanged == 'true' && needs.pick.outputs.opencc || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
      - name: Push the updates to the base branch
        run: python scripts/dependabot_update.py land "$ACTIONS_UPDATE" "$OPENCC_UPDATE"
